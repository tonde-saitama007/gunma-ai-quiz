    const $=id=>document.getElementById(id);
    const state={selected:[],index:0,points:0,correct:0,deadline:0,timer:null,locked:false};
    const shuffle=list=>{const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    function choose(){return shuffle(QUESTIONS).slice(0,10)}
    function show(which){for(const id of ["start","quiz","result"])$(id).hidden=id!==which;window.scrollTo({top:0,behavior:"instant"})}
    function stopTimer(){if(state.timer!==null){clearInterval(state.timer);state.timer=null}}
    function start(){stopTimer();$("copy-btn").textContent="シェア用リンクをコピー";state.selected=choose();state.index=0;state.points=0;state.correct=0;show("quiz");renderQuestion()}
    function renderQuestion(){
      state.locked=false;const q=state.selected[state.index];
      $("count").textContent=`第${state.index+1}問 / 10問`;
      $("score").textContent=`${state.points}点`;
      $("progress").style.width=`${state.index*10}%`;
      document.querySelector(".track").setAttribute("aria-valuenow",String(state.index));
      $("category").textContent=q.c;
      $("question").textContent=q.q;
      $("feedback").hidden=true;$("next-btn").hidden=true;
      const answers=$("answers");answers.replaceChildren();
      q.o.forEach((option,i)=>{const b=document.createElement("button");b.type="button";b.className="answer";b.textContent=`${"ABCD"[i]}. ${option}`;b.addEventListener("click",()=>answer(i));answers.append(b)});
      $("timerbox").classList.remove("urgent");
      state.deadline=performance.now()+15000;tick();state.timer=setInterval(tick,50);
      $("question").focus({preventScroll:true});
    }
    function tick(){if(state.locked)return;const ms=Math.max(0,state.deadline-performance.now());$("time").textContent=`${(ms/1000).toFixed(1)}秒`;$("timerbox").classList.toggle("urgent",ms<=5000);if(ms<=0)answer(null)}
    function answer(choice){
      if(state.locked)return;
      const remaining=Math.max(0,state.deadline-performance.now());
      if(remaining<=0)choice=null;
      state.locked=true;stopTimer();
      const q=state.selected[state.index],isCorrect=choice===q.a;
      let gained=0;
      if(isCorrect){const elapsed=15-remaining/1000;const bonus=elapsed<=5?2:elapsed<=10?1:0;gained=8+bonus;state.points+=gained;state.correct++}
      $("score").textContent=`${state.points}点`;
      [...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("correct");else if(i===choice)b.classList.add("wrong")});
      const feedback=$("feedback");feedback.classList.toggle("bad",!isCorrect);
      const heading=document.createElement("strong");heading.textContent=isCorrect?`正解！ +${gained}点`:choice===null?"時間切れ！":"残念！";
      const detail=document.createElement("p");detail.textContent=`正解：${q.o[q.a]}。${q.e}`;
      feedback.replaceChildren(heading,detail);feedback.hidden=false;
      $("next-btn").textContent=state.index===9?"結果を見る →":"次の問題へ →";$("next-btn").hidden=false;
      $("next-btn").focus({preventScroll:true});
    }
    function rankFor(points){if(points>=90)return["上州マスター","もう群馬の案内人になれそう！"];if(points>=70)return["群馬愛の達人","かなり深い群馬愛です！"];if(points>=50)return["群馬通","名所も歴史もよく知っています！"];if(points>=30)return["群馬探検家","新しい群馬をまだまだ発見できそう！"];return["群馬ルーキー","ここから群馬の魅力を探していこう！"]}
    function finish(){stopTimer();const [title,copy]=rankFor(state.points);$("final-score").textContent=state.points;$("rank").textContent=title;$("result-copy").textContent=copy;$("result-meta").textContent=`10問中${state.correct}問正解`;$("progress").style.width="100%";show("result")}
    function shareText(){const [title]=rankFor(state.points);return `あなたの群馬愛は何点？\n${state.points}点／100点！称号は「${title}」⛰️\n10問中${state.correct}問正解。あなたも挑戦！\n▼ 群馬愛クイズに挑戦\nhttps://tonde-saitama007.github.io/gunma-ai-quiz/\n#群馬愛クイズ`}
    async function copyResult(){
      const url="https://tonde-saitama007.github.io/gunma-ai-quiz/";
      let ok=false;
      try{await navigator.clipboard.writeText(url);ok=true}catch(error){
        const t=document.createElement("textarea");t.value=url;document.body.appendChild(t);t.focus();t.select();
        try{ok=document.execCommand("copy")}catch(e){}t.remove();
      }
      $("copy-btn").textContent=ok?"リンクをコピーしました！":"コピーできませんでした";
    }
    async function shareResultImage(){
      const button=$("image-share-btn");
      button.disabled=true;button.textContent="画像を準備中…";
      try{
        const canvas=document.createElement("canvas");
        canvas.width=1080;canvas.height=1080;
        const ctx=canvas.getContext("2d");
        if(!ctx)throw new Error("Canvas unavailable");
        ctx.fillStyle="#f4f6ed";ctx.fillRect(0,0,1080,1080);
        ctx.fillStyle="#3f7350";
        ctx.beginPath();ctx.roundRect(55,50,100,100,24);ctx.fill();
        ctx.fillStyle="#fff";ctx.font='bold 65px "Noto Sans JP",sans-serif';
        ctx.textAlign="center";ctx.fillText("群",105,123);
        ctx.textAlign="left";ctx.fillStyle="#396249";
        ctx.font='bold 43px sans-serif';ctx.fillText("GUNMA LOVE QUIZ",180,115);
        ctx.shadowColor="rgba(36,75,112,.12)";ctx.shadowBlur=28;ctx.shadowOffsetY=12;
        ctx.fillStyle="#fff";ctx.beginPath();ctx.roundRect(55,190,970,835,42);ctx.fill();
        ctx.shadowColor="transparent";ctx.shadowBlur=0;ctx.shadowOffsetY=0;
        ctx.fillStyle="#96552c";ctx.font="bold 33px sans-serif";ctx.fillText("RESULT",115,285);
        ctx.fillStyle="#243d30";ctx.font='bold 65px "Noto Sans JP",sans-serif';
        ctx.fillText("あなたの群馬愛は…",115,395);
        ctx.fillStyle="#3f7350";ctx.font="bold 175px sans-serif";
        const score=String(state.points);
        ctx.fillText(score,115,630);
        const scoreWidth=ctx.measureText(score).width;
        ctx.font='bold 57px "Noto Sans JP",sans-serif';ctx.fillText("点 / 100点",135+scoreWidth,620);
        const [rank,description]=rankFor(state.points);
        ctx.font='bold 46px "Noto Sans JP",sans-serif';
        const chipWidth=Math.min(850,ctx.measureText(rank).width+78);
        ctx.fillStyle="#f3e3c4";ctx.beginPath();ctx.roundRect(115,695,chipWidth,95,48);ctx.fill();
        ctx.fillStyle="#805126";ctx.fillText(rank,154,759);
        ctx.fillStyle="#586b58";ctx.font='39px "Noto Sans JP",sans-serif';
        ctx.fillText(description,115,865);
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
        if(!blob)throw new Error("PNG unavailable");
        const url=URL.createObjectURL(blob);
        const link=document.createElement("a");
        link.href=url;link.download="gunma-love-quiz-result.png";
        document.body.appendChild(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),60000);
      }catch(error){
        alert("画像を保存できませんでした。Chromeで開き直してお試しください。");
      }finally{
        button.disabled=false;button.textContent="画像を保存する";
      }
    }
    $("image-share-btn").addEventListener("click",shareResultImage);
    window.quizStartFallback=start;
    $("next-btn").addEventListener("click",()=>{if(state.index===9)finish();else{state.index++;renderQuestion()}});
    $("retry-btn").addEventListener("click",()=>{stopTimer();$("copy-btn").textContent="シェア用リンクをコピー";show("start")});
    $("copy-btn").addEventListener("click",copyResult);
    document.addEventListener("visibilitychange",()=>{if(document.hidden===false&&state.timer!==null)tick()});
  </script>
</body>
</html>
